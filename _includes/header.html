<!-- ============================================================
     Шапка сайта — логотип, навигация, переключатель темы, бургер
     ============================================================ -->
<header class="site-header" role="banner">
  <div class="header-inner">
    <!-- Логотип -->
    <a href="/" class="logo" aria-label="На главную">{{ site.logo_text }}</a>

    <!-- Десктопная навигация -->
    <nav aria-label="Основная навигация">
      <ul class="nav-links">
        <li><a href="/about/">Обо мне</a></li>
        <li><a href="/cases/">Кейсы</a></li>
        <li><a href="/resume/">Резюме</a></li>
        <li><a href="/contact/">Контакты</a></li>
        <!-- Переключатель темы -->
        <li>
          <button class="theme-toggle" id="themeToggle"
                  aria-label="Переключить тему"
                  title="Сменить тему">
            <!-- Солнце (для тёмной темы) -->
            <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg"
                 viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"/>
              <line x1="12" y1="1" x2="12" y2="3"/>
              <line x1="12" y1="21" x2="12" y2="23"/>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
              <line x1="1" y1="12" x2="3" y2="12"/>
              <line x1="21" y1="12" x2="23" y2="12"/>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
            <!-- Луна (для светлой темы) -->
            <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg"
                 viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
          </button>
        </li>
      </ul>
    </nav>

    <!-- Мобильный бургер -->
    <button class="burger" id="burgerBtn"
            aria-label="Открыть меню"
            aria-expanded="false"
            aria-controls="mobileMenu">
      <span></span>
    </button>
  </div>
</header>

<!-- Мобильное оверлей-меню -->
<div class="mobile-menu" id="mobileMenu" role="dialog" aria-modal="true" aria-label="Мобильное меню">
  <a href="/about/">Обо мне</a>
  <a href="/cases/">Кейсы</a>
  <a href="/resume/">Резюме</a>
  <a href="/contact/">Контакты</a>
  <button class="theme-toggle" id="mobileThemeToggle"
          aria-label="Переключить тему" style="margin-top:1rem;">
    <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg"
         viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="5"/>
      <line x1="12" y1="1" x2="12" y2="3"/>
      <line x1="12" y1="21" x2="12" y2="23"/>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
      <line x1="1" y1="12" x2="3" y2="12"/>
      <line x1="21" y1="12" x2="23" y2="12"/>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
    </svg>
    <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg"
         viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
  </button>
</div>
