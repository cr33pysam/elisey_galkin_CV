# ============================================================
# GitHub Actions workflow — автоматическая сборка через GH Pages
# Размещаем здесь, чтобы Jekyll подхватил конфигурацию
# ============================================================

name: GitHub Pages Build

on:
  push:
    branches: [main, master, gh-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          cache-version: 0
      - run: bundle exec jekyll build --destination _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
