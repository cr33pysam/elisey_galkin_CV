---
layout: default
title: Case
---

<article class="case-page">
  <div class="container container--narrow">

    <a href="/cases/" class="back-link">← Все кейсы</a>

    <header class="case-header">
      <p class="page-eyebrow">{{ page.tag }}</p>
      <h1 class="page-title case-title">{{ page.title }}</h1>
      <time datetime="{{ page.date }}">{{ page.date | date: '%B %Y' }}</time>
    </header>

    <div class="prose prose--lg">{{ content }}</div>

  </div>
</article>
