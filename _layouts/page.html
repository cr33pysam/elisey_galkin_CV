---
# ============================================================
# Базовый layout для обычных страниц
# ============================================================
layout: default
---

<div class="wrapper">
  <article class="page-content">
    <header class="page-header">
      <h1>{{ page.title }}</h1>
      {% if page.excerpt %}
        <p class="page-excerpt">{{ page.excerpt }}</p>
      {% endif %}
    </header>
    <div class="page-body">
      {{ content }}
    </div>
  </article>
</div>
