# ═══════════════════════════════════════════
#  Galkin Portfolio — GitHub Pages config
# ═══════════════════════════════════════════

title: Galkin Portfolio
description: Designer & developer portfolio

# ── URL ───────────────────────────────────────
# Для username.github.io → url: https://username.github.io  baseurl: ""
# Для обычного репо     → url: ""                        baseurl: "/repo-name"
url: ""
baseurl: "/elisey_galkin_CV"

# Markdown renderer (GitHub Pages стандарт)
markdown: kramdown

# ── Collections ───────────────────────────────
# Кейсы лежат в _cases/ → доступны на /cases/:name/
collections:
  cases:
    output: true
    permalink: /cases/:name/

# Дефолтный layout для всех .md страниц
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: default
  - scope:
      path: "_cases"
      type: "files"
    values:
      layout: default
