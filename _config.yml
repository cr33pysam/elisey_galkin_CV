# ============================================================
# Jekyll-конфигурация для сайта-визитки Елисея Галкина
# Все настройки для GitHub Pages (static only, no plugins)
# ============================================================

title: "Елисей Галкин"
description: "Project Manager в EdTech — системное управление командами и ИИ-автоматизации"
baseurl: "/elisey_galkin_CV"   # имя репозитория — добавляется ко всем ссылкам
url: "https://cr33pysam.github.io"
lang: "ru"

# Автор / владелец сайта
author:
  name: "Елисей Галкин"
  email: "elisey.galkin@proton.me"
  twitter: "cr33pysam"
  github: "cr33pysam"

# Соцсети (ссылки для футера)
social:
  github: "https://github.com/cr33pysam"
  telegram: "https://t.me/cr33pysam"
  linkedin: "https://linkedin.com/in/elisey-galkin"

# Акцентный цвет — приглушённый терракотовый (#C0564A).
# Для синего замените на #2563EB.
accent_color: "#C0564A"

# Логотип (текстовый или SVG в asset)
logo_text: "ЕГ"

# Ключевые слова для SEO
keywords: "project manager, edtech, продукт-менеджмент, Asana, Notion, Python, Agile"

# Время публикации (timezone)
timezone: Asia/Novosibirsk

# ---- COLLECTIONS: кейсы -----------------------------------
collections:
  cases:
    output: true
    permalink: /cases/:path/

plugins: []

# Компрессия и оптимизация
markdown: kramdown
# GFM поддерживается kramdown на GitHub Pages по умолчанию
sass:
  style: compressed

# ---------- Исключения --------------------------------------
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - .git
  - .github
  - node_modules
  - vendor

encoding: utf-8
line_endings: unix
