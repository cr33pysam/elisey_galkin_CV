name: Galkin Portfolio
description: >
  Personal portfolio and CV — built with Jekyll & GitHub Pages
baseurl: ""
url: ""

# Collections
collections:
  cases:
    output: true
    permalink: /cases/:name/

# Default layout for all pages
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
  - scope:
      path: "_cases"
      type: "files"
    values:
      layout: "case"

# Build settings
exclude:
  - README.md
  - README.txt
  - node_modules
  - .gitignore
  - .jekyll-cache

# Plugins
plugins:
  - jekyll-feed

# Feed settings
feed:
  path: feed.xml
